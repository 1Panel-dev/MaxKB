name: build-and-push-vector-model

on:
  workflow_dispatch:
    inputs:
      dockerImageTag:
        description: 'Docker Image Tag'
        default: 'v2.0.3'
        required: true
      architecture:
        description: 'Architecture'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

jobs:
  build-and-push-vector-model-to-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Prepare
        id: prepare
        env:
          DOCKER_PLATFORMS: ${{ github.event.inputs.architecture }}
          TAG_NAME: ${{ github.event.inputs.dockerImageTag }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag" >&2
            exit 1
          fi
          case "$DOCKER_PLATFORMS" in
            linux/amd64|linux/arm64|linux/amd64,linux/arm64) ;;
            *) echo "Invalid architecture" >&2; exit 1 ;;
          esac
          DOCKER_IMAGE=ghcr.io/1panel-dev/maxkb-vector-model
          DOCKER_IMAGE_TAGS="--tag ${DOCKER_IMAGE}:${TAG_NAME} --tag ${DOCKER_IMAGE}:latest"
          echo "buildx_args=--platform ${DOCKER_PLATFORMS} --no-cache \
            --build-arg VERSION=${TAG_NAME} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${GITHUB_SHA::8} \
            ${DOCKER_IMAGE_TAGS} ." >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Docker Buildx (build-and-push)
        env:
          BUILDX_ARGS: ${{ steps.prepare.outputs.buildx_args }}
        run: |
          read -r -a buildx_args <<< "$BUILDX_ARGS"
          docker buildx build --output "type=image,push=true" "${buildx_args[@]}" -f installer/Dockerfile-vector-model