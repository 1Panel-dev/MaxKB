version: '3.8'

# MaxKB v2.0 分离部署 Docker Compose 配置
# 用于开发和测试环境快速部署

services:
  # Redis 缓存服务
  maxkb-redis:
    image: redis:7-alpine
    container_name: maxkb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Password123@redis}
    command: redis-server --requirepass ${REDIS_PASSWORD:-Password123@redis} --appendonly yes
    volumes:
      - maxkb-redis-data:/data
    networks:
      - maxkb-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Password123@redis}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL 数据库服务
  maxkb-postgres:
    image: pgvector/pgvector:pg17
    container_name: maxkb-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${DB_USER:-maxkb}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Password123@postgres}
      - POSTGRES_MAX_CONNECTIONS=1000
    volumes:
      - maxkb-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - maxkb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-maxkb} -d maxkb"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 向量模型服务 (用作数据卷)
  maxkb-models:
    image: ${REGISTRY:-}maxkb/models:${TAG:-v2.0}
    container_name: maxkb-models
    volumes:
      - maxkb-models-data:/opt/maxkb-app/model
    command: ["echo", "Models container initialized"]
    networks:
      - maxkb-network

  # MaxKB 后台应用
  maxkb-backend:
    image: ${REGISTRY:-}maxkb/backend:${TAG:-v2.0}
    container_name: maxkb-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - MAXKB_CONFIG_TYPE=ENV
      - MAXKB_DB_NAME=maxkb
      - MAXKB_DB_HOST=maxkb-postgres
      - MAXKB_DB_PORT=5432
      - MAXKB_DB_USER=${DB_USER:-maxkb}
      - MAXKB_DB_PASSWORD=${DB_PASSWORD:-Password123@postgres}
      - MAXKB_REDIS_HOST=maxkb-redis
      - MAXKB_REDIS_PORT=6379
      - MAXKB_REDIS_PASSWORD=${REDIS_PASSWORD:-Password123@redis}
      - MAXKB_REDIS_DB=0
      - MAXKB_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAXKB_EMBEDDING_MODEL_PATH=/opt/maxkb-app/model/embedding
      - MAXKB_EMBEDDING_MODEL_NAME=/opt/maxkb-app/model/embedding/shibing624_text2vec-base-chinese
    volumes:
      - maxkb-logs:/opt/maxkb/logs
      - maxkb-local:/opt/maxkb/local
      - maxkb-models-data:/opt/maxkb-app/model
    depends_on:
      maxkb-postgres:
        condition: service_healthy
      maxkb-redis:
        condition: service_healthy
      maxkb-models:
        condition: service_completed_successfully
    networks:
      - maxkb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # 前端页面服务
  maxkb-frontend:
    image: ${REGISTRY:-}maxkb/frontend:${TAG:-v2.0}
    container_name: maxkb-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - BACKEND_HOST=maxkb-backend
      - BACKEND_PORT=8080
    depends_on:
      maxkb-backend:
        condition: service_healthy
    networks:
      - maxkb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# 数据卷
volumes:
  maxkb-redis-data:
    driver: local
  maxkb-postgres-data:
    driver: local
  maxkb-models-data:
    driver: local
  maxkb-logs:
    driver: local
  maxkb-local:
    driver: local

# 网络
networks:
  maxkb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16