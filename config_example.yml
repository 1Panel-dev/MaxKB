# MaxKB v2.0 配置文件示例
# 复制此文件为 config.yml 并根据实际情况修改

# ================================
# 基础配置
# ================================

# 调试模式 (生产环境设置为 false)
DEBUG: false

# 时区设置
TIME_ZONE: 'Asia/Shanghai'

# 语言设置
LANGUAGE_CODE: 'zh-CN'

# 日志级别: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL: 'INFO'

# ================================
# 数据库配置
# ================================

# 数据库类型 (支持 PostgreSQL)
DB_ENGINE: 'dj_db_conn_pool.backends.postgresql'

# 数据库连接信息
DB_NAME: 'maxkb'
DB_HOST: 'localhost'
DB_PORT: 5432
DB_USER: 'maxkb'
DB_PASSWORD: 'your-secure-db-password'

# 数据库连接池配置
DB_MAX_OVERFLOW: 80

# ================================
# Redis 缓存配置
# ================================

# Redis 连接信息
REDIS_HOST: 'localhost'
REDIS_PORT: 6379
REDIS_PASSWORD: 'your-secure-redis-password'
REDIS_DB: 0

# Redis 连接池配置
REDIS_MAX_CONNECTIONS: 100

# Redis 哨兵模式配置 (可选，用于高可用)
# REDIS_SENTINEL_SENTINELS: 'sentinel1:26379,sentinel2:26379,sentinel3:26379'
# REDIS_SENTINEL_MASTER: 'mymaster'

# ================================
# 本地模型服务配置
# ================================

# 本地模型服务地址
LOCAL_MODEL_HOST: '127.0.0.1'
LOCAL_MODEL_PORT: '11636'
LOCAL_MODEL_PROTOCOL: 'http'

# 本地模型工作进程数
LOCAL_MODEL_HOST_WORKER: 1

# ================================
# 沙箱环境配置
# ================================

# 是否启用沙箱 (1: 启用, 0: 禁用)
SANDBOX: 1

# Python 包路径
SANDBOX_PYTHON_PACKAGE_PATHS: '/opt/py3/lib/python3.11/site-packages,/opt/maxkb-app/sandbox/python-packages,/opt/maxkb/python-packages'

# Python 禁用关键字
SANDBOX_PYTHON_BANNED_KEYWORDS: 'subprocess.,system(,exec(,pty.,eval(,compile(,shutil.,input(,__import__'

# ================================
# Web 服务配置
# ================================

# 管理后台路径
ADMIN_PATH: '/admin'

# 聊天页面路径
CHAT_PATH: '/chat'

# ================================
# 文件存储配置
# ================================

# 本地文件存储路径
LOCAL_FILE_PATH: '/opt/maxkb/local'

# 模型文件存储路径
MODEL_PATH: '/opt/maxkb-app/model'

# 日志文件路径
LOG_PATH: '/opt/maxkb/logs'

# ================================
# 安全配置
# ================================

# Django 密钥 (生产环境请修改)
SECRET_KEY: 'django-insecure-change-this-in-production'

# 允许的主机 (生产环境请配置具体域名)
ALLOWED_HOSTS: 
  - '*'

# ================================
# 邮件配置 (可选)
# ================================

# 邮件服务器配置
# EMAIL_HOST: 'smtp.example.com'
# EMAIL_PORT: 587
# EMAIL_HOST_USER: 'noreply@example.com'
# EMAIL_HOST_PASSWORD: 'your-email-password'
# EMAIL_USE_TLS: true
# DEFAULT_FROM_EMAIL: 'MaxKB <noreply@example.com>'

# ================================
# 第三方服务配置 (可选)
# ================================

# 对象存储配置 (如 MinIO, AWS S3)
# OSS_TYPE: 'minio'  # minio, aws, aliyun, tencent
# OSS_ENDPOINT: 'http://localhost:9000'
# OSS_ACCESS_KEY: 'your-access-key'
# OSS_SECRET_KEY: 'your-secret-key'
# OSS_BUCKET: 'maxkb'
# OSS_REGION: 'us-east-1'

# 消息队列配置 (如 RabbitMQ)
# MQ_TYPE: 'rabbitmq'
# MQ_HOST: 'localhost'
# MQ_PORT: 5672
# MQ_USER: 'guest'
# MQ_PASSWORD: 'guest'
# MQ_VHOST: '/'