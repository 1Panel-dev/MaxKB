[project]
name = "maxkb"
version = "2.0.0"
description = "强大易用的开源企业级智能体平台"
authors = [{ name = "shaohuzhang1", email = "shaohu.zhang@fit2cloud.com" }]
requires-python = "~=3.13.0"
readme = "README.md"
dependencies = [
    "django==6.0.6",
    "drf-spectacular[sidecar]==0.29.0",
    "django-redis==7.0.0",
    "django-mptt==0.18.0",
    "django-db-connection-pool==1.2.6",
    "djangorestframework==3.17.1",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "uuid-utils==0.16.2",
    "captcha==0.7.1",
    "pytz==2026.2",
    "psutil==7.2.2",
    "beautifulsoup4==4.15.0",
    "jieba==0.42.1",
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langchain-openai==1.3.3",
    "langchain-anthropic==1.4.7",
    "langchain-google-genai==4.2.5",
    "langchain-mcp-adapters==0.3.0",
    "langchain-huggingface==1.2.2",
    "langchain-ollama==1.1.0",
    "langchain-aws==1.6.0",
    "langgraph==1.2.6",
    "deepagents==0.6.11",
    "transformers==5.12.1",
    "torch==2.12.1",
    "qianfan==0.4.12.3",
    "zai-sdk==0.2.3",
    "volcengine-python-sdk[ark]==5.0.35",
    "boto3==1.43.36",
    "tencentcloud-sdk-python==3.1.122",
    "xinference-client==2.11.0",
    "anthropic==0.112.0",
    "dashscope==1.26.0",
    "celery[sqlalchemy]==5.6.3",
    "django-celery-beat==2.9.0",
    "celery-once==3.0.1",
    "django-apscheduler==0.7.0",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "xlrd==2.0.2",
    "xlwt==1.3.0",
    "pypdf==6.14.2",
    "pydub==0.25.1",
    "audioop-lts==0.2.2",
    "pysilk==0.0.1",
    "gunicorn==26.0.0",
    "python-daemon==3.1.2",
    "websockets==15.0.1",
    "ruff==0.15.20",
    "cohere==7.0.4",
    "jsonpath-ng==1.8.0",
    "markdownify==1.2.2",
    "polib==1.2.0",
    "cryptography==49.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "macpytorch"
url = "https://download.pytorch.org/whl"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch", marker = "sys_platform == 'linux'" },
    { index = "pytorch", marker = "sys_platform == 'win'" },
    { index = "macpytorch", marker = "sys_platform == 'darwin'" },
]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
