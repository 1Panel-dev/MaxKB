[project]
name = "maxkb"
version = "2.0.0"
description = "强大易用的开源企业级智能体平台"
authors = [{ name = "shaohuzhang1", email = "shaohu.zhang@fit2cloud.com" }]
requires-python = "~=3.13.0"
readme = "README.md"
dependencies = [
    # Web framework & API
    "django==6.0.7",
    "djangorestframework==3.17.2",
    "drf-spectacular[sidecar]==0.30.0",

    # Django ecosystem
    "django-apscheduler==0.7.0",
    "django-db-connection-pool==1.2.6",
    "django-mptt==0.18.0",
    "django-redis==7.0.0",

    # AI orchestration & model frameworks
    "deepagents==0.7.5",
    "langchain==1.3.14",
    "langchain-anthropic==1.5.4",
    "langchain-aws==1.7.0",
    "langchain-core==1.5.3",
    "langchain-google-genai==4.3.2",
    "langchain-huggingface==1.2.2",
    "langchain-mcp-adapters==0.3.2",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.4.1",
    "langgraph==1.2.10",
    "torch==2.13.0",
    "sentence-transformers==5.7.0",
    "xinference-client==3.1.0",

    # Model providers & cloud SDKs
    "anthropic==0.120.2",
    "boto3==1.43.66",
    "cohere==7.0.8",
    "dashscope==1.26.5",
    "qianfan==0.4.12.3",
    "tencentcloud-sdk-python-common==3.1.152",
    "tencentcloud-sdk-python-hunyuan==3.1.56",
    "tencentcloud-sdk-python-asr==3.1.137",
    "volcengine-python-sdk[ark]==5.0.44",
    "zai-sdk==0.2.3",

    # Database, cache & async task queue
    "celery[sqlalchemy]==5.6.3",
    "celery-once==3.0.1",
    "psycopg[binary]==3.3.4",

    # Document & media processing
    "audioop-lts==0.2.2",
    "beautifulsoup4==4.15.0",
    "jieba==0.42.1",
    "markdownify==1.2.3",
    "openpyxl==3.1.5",
    "pydub==0.25.1",
    "pypdf==6.15.0",
    "pysilk==0.0.1",
    "python-docx==1.2.0",
    "xlrd==2.0.2",
    "xlwt==1.3.0",

    # Runtime, utility & security
    "captcha==0.7.1",
    "cryptography==50.0.0",
    "jsonpath-ng==1.8.0",
    "polib==1.2.0",
    "psutil==7.2.2",
    "python-daemon==3.1.2",
    "python-dotenv==1.2.2",
    "pytz==2026.3.post1",
    "uuid-utils==0.17.0",

    # Server & development tools
    "gunicorn==26.0.0",
    "ruff==0.15.21",
]

[dependency-groups]
dev = ["pre-commit==4.6.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "macpytorch"
url = "https://download.pytorch.org/whl"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch", marker = "sys_platform == 'linux'" },
    { index = "pytorch", marker = "sys_platform == 'win32'" },
    { index = "macpytorch", marker = "sys_platform == 'darwin'" },
]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
